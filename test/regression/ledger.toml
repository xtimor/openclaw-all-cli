# Regression ledger (epic-regression-gate ticket 1): one [[bug]] per closed `type:bug` issue, and the tests that guard it.
#
# Checked offline by test/regression/ledger.test.ts (every named file and test title exists, the schema below holds) and
# in CI by `node scripts/regression-ledger.mjs check-issues` (every closed `type:bug` issue has an entry). Parsed by
# test/regression/ledger.ts, which reads only this TOML subset: `#` comments, `[[bug]]`, `key = "string" | integer |
# true | false | [ ... ]`, arrays of strings or one-line inline tables. Never delete an entry; a bug fix adds or
# updates its own (docs/agents/implement.md, "Regression ledger").
#
# Keys of a [[bug]]:
#   issue           integer, the GitHub issue number (one entry per issue)
#   title           short description of the bug
#   family          kebab-case family; a bug that came back shares its family with the first one
#   tier            where the bug showed: unit (vitest, no host), gateway (a real Gateway with a scripted Cursor,
#                   test/regression/gateway/), ui (the Control UI in a browser), live (real cursor-agent, test/live/)
#   fixed           false when the issue was closed with no plugin change that fixes it
#   tests           array of { file = "repo-relative path", name = "substring of a describe/it/test title",
#                   tier = "unit|gateway|ui|live", reproduces = true|false }; may be empty.
#                   reproduces = true only when the test recreates the bug's original conditions; a lower-tier
#                   proxy (a unit test for a Gateway-visible bug) says false.
#   planned         optional: the epic-regression-gate ticket(s) that will add the test at the bug's tier, "4.3" or "4.3, 4.6"
#   no_test_reason  optional: why the bug has no test and none is planned
# An entry needs at least one of tests, planned, no_test_reason.

[[bug]]
issue = 11
title = "15-20 s to first token: cursor-agent restarted on every turn"
family = "first-reply-latency"
tier = "gateway"
fixed = true
tests = [
  { file = "test/host-contract.test.ts", name = "reuses the process on a later turn (no initialize, no session/load)", tier = "unit", reproduces = false },
  { file = "test/live/turn-latency.live.test.ts", name = "times four plain turns of one session on one warm process", tier = "live", reproduces = true },
  { file = "test/regression/gateway/turn-process.regression.test.ts", name = "#11/#38: two `openclaw agent` turns of one session run on one cursor-agent process with no session/load", tier = "gateway", reproduces = true },
]

