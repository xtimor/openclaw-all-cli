[workflow]
# A change that alters what a user of the plugin sees adds its line under Unreleased in CHANGELOG.md (docs/release.md, "Changelog").
# A bug fix adds its regression ledger entry and a test at the tier where the bug showed (docs/agents/implement.md, "Regression ledger").
persistent_facts = [
  "Changelog rule: when this change alters what a user of the plugin sees (behavior, setup or configuration, docs a user follows, a fixed issue), add one plain-words line under `## Unreleased` in `CHANGELOG.md`, in the same change, with the issue link when there is one (format and examples: docs/release.md, section Changelog). Internal-only changes (CI, the agent flow, tests, tickets, plans, run logs, refactors) add none. Never stamp a version or release.",
  "Regression ledger rule: a fix of a `type:bug` issue adds or updates that issue's `[[bug]]` entry in `test/regression/ledger.toml` in the same change (schema in the file header; never delete an entry), with a test at the tier where the bug showed: `gateway` (`test/regression/gateway/`) or `ui` for a bug seen through the Gateway or the Control UI, `live` (`test/live/`) for model behavior, `unit` only for a bug inside the plugin's own code. Prove the test red before the fix and green after. A lower-tier proxy says `reproduces = false`; a test that cannot exist yet is named by its epic-regression-gate ticket in `planned`, never invented. `npx vitest run test/regression/ledger.test.ts` must pass (docs/agents/implement.md, \"Regression ledger\").",
]
