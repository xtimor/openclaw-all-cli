name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run of the same pull request; every push to main gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same defaults as scripts/dev-openclaw.sh, which reads these two variables (through ci-check.sh).
  NODE_VERSION: 24.22.0
  OPENCLAW_VERSION: 2026.10.3

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/plan-gate.mjs --changed compares with origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .spike/node
            .spike/openclaw
          key: spike-${{ runner.os }}-node${{ env.NODE_VERSION }}-openclaw${{ env.OPENCLAW_VERSION }}
      - run: scripts/ci-check.sh
