name: Regression

# The Gateway regression tier (`scripts/regression.sh gateway`: a real Gateway with the packed plugin and the fake
# cursor-agent) on one or more OpenClaw versions (epic-regression-gate ticket 4). `resolve` turns the requests into
# versions with the script's own rules (min from package.json, tags through npm) and one matrix entry per distinct
# version; `gateway` runs the tier once per version, named `gateway (<requests> = <version>)`; `summary` writes the
# table of results to the job summary and the `results` output. Callers: ci.yml (min and latest), regression-beta.yml
# (beta, weekly), and release.yml from ticket 4.7 (with its packed `.tgz` through `tgz_artifact`).
# No secret anywhere: the tier runs on the fake cursor-agent and the script unsets any Cursor key.
on:
  workflow_call:
    inputs:
      versions:
        description: "OpenClaw versions to test, space or comma separated: min, latest, extended-stable, beta, or X.Y.Z"
        type: string
        default: min latest
      tgz_artifact:
        description: "Name of an artifact of this run holding exactly one packed openclaw-all-cli .tgz to test instead of packing"
        type: string
        default: ""
      force_red:
        description: "Fail every version on purpose after its tier ran (to exercise a caller's red path)"
        type: boolean
        default: false
    outputs:
      results:
        description: "JSON array, one entry per distinct version: version, requests, result, seconds, sha256, failed"
        value: ${{ jobs.summary.outputs.results }}
  workflow_dispatch:
    inputs:
      versions:
        description: "OpenClaw versions to test, space or comma separated: min, latest, extended-stable, beta, or X.Y.Z"
        type: string
        default: min latest
      force_red:
        description: "Fail every version on purpose after its tier ran"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Same default as ci.yml and scripts/dev-openclaw.sh (the isolated Node the tier runs on).
  NODE_VERSION: 24.22.0

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # An unknown tag fails here with the script's message, before any tier job starts.
      - id: resolve
        name: Resolve the OpenClaw versions
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -f # the requests are words, never globs
          read -r -a requests <<<"${VERSIONS//,/ }"
          if ! versions="$(scripts/regression.sh resolve "${requests[@]}" 2>"$RUNNER_TEMP/resolve.err")"; then
            cat "$RUNNER_TEMP/resolve.err" >&2
            echo "::error title=Regression versions::$(tr '\n' ' ' <"$RUNNER_TEMP/resolve.err")"
            exit 1
          fi
          # A request that is the version itself (X.Y.Z) is not repeated in the job name.
          matrix="$(jq -c '{include: map({version, requests: (.requests | join(", ")), label: ((.requests - [.version]) as $named | if ($named | length) == 0 then .version else "\($named | join(", ")) = \(.version)" end)})}' <<<"$versions")"
          echo "versions=$versions" >>"$GITHUB_OUTPUT"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          {
            echo "### OpenClaw versions"
            echo
            echo "| Requested | OpenClaw |"
            echo "| --- | --- |"
            jq -r '.[] | "| \(.requests | join(", ")) | \(.version) |"' <<<"$versions"
          } >>"$GITHUB_STEP_SUMMARY"

  gateway:
    needs: resolve
    name: gateway (${{ matrix.label }})
    runs-on: ubuntu-latest
    # About 10 minutes of tier, plus Node, OpenClaw, npm ci, and the build on a cold cache.
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      # A red version fails its own job; the others still run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      OPENCLAW: ${{ matrix.version }}
      RESULT: .regression/logs/result-${{ matrix.version }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: build
        name: OpenClaw the plugin builds against
        run: echo "version=$(node -p 'require("./package.json").openclaw.build.openclawVersion')" >>"$GITHUB_OUTPUT"
      # Node and OpenClaw per version, like the .spike cache in ci.yml; the state is always fresh (the script wipes it).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .regression/openclaw-${{ matrix.version }}/node
            .regression/openclaw-${{ matrix.version }}/openclaw
          key: regression-${{ runner.os }}-node${{ env.NODE_VERSION }}-openclaw${{ matrix.version }}
      # The script builds against the pinned OpenClaw whatever version it tests; not needed with a given .tgz.
      - if: steps.build.outputs.version != matrix.version && !inputs.tgz_artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .regression/openclaw-${{ steps.build.outputs.version }}/node
            .regression/openclaw-${{ steps.build.outputs.version }}/openclaw
          key: regression-${{ runner.os }}-node${{ env.NODE_VERSION }}-openclaw${{ steps.build.outputs.version }}
      - if: inputs.tgz_artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tgz_artifact }}
          path: ${{ runner.temp }}/regression-tgz
      - name: Gateway tier (OpenClaw ${{ matrix.version }})
        env:
          REQUESTS: ${{ matrix.requests }}
          TGZ_DIR: ${{ inputs.tgz_artifact && format('{0}/regression-tgz', runner.temp) || '' }}
          FORCE_RED: ${{ inputs.force_red }}
        run: |
          mkdir -p .regression/logs
          args=(gateway --openclaw "$OPENCLAW" --result "$RESULT")
          if [ -n "$TGZ_DIR" ]; then
            shopt -s nullglob
            tgz=("$TGZ_DIR"/*.tgz)
            if [ "${#tgz[@]}" -ne 1 ]; then
              echo "::error title=Regression tgz::the artifact must hold exactly one .tgz, found ${#tgz[@]}"
              exit 1
            fi
            args+=(--tgz "${tgz[0]}")
          fi
          status=0
          scripts/regression.sh "${args[@]}" 2>&1 | tee .regression/logs/tier.log || status=$?
          if [ ! -f "$RESULT" ]; then
            jq -n --arg v "$OPENCLAW" '{version: $v, result: "error", failed: []}' >"$RESULT"
          fi
          if [ "$FORCE_RED" = true ]; then
            echo "::warning title=Regression::force_red: this version fails on purpose"
            jq '.result = "failed" | .failed += ["force_red: failed on purpose (workflow_dispatch input)"]' "$RESULT" >"$RESULT.tmp"
            mv "$RESULT.tmp" "$RESULT"
            status=1
          fi
          jq --arg r "$REQUESTS" '.requests = ($r | split(", "))' "$RESULT" >"$RESULT.tmp"
          mv "$RESULT.tmp" "$RESULT"
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-result-${{ matrix.version }}
          path: ${{ env.RESULT }}
          if-no-files-found: ignore
          retention-days: 7
      # The Gateway logs the scenario files keep: OpenClaw 2026.11 and later write them to the state's logs/, 2026.10 to
      # $TMPDIR/openclaw/. With the tier's console output (tier.log) and the Vitest JSON report.
      - if: failure()
        name: Collect the failure logs
        run: |
          mkdir -p .regression/logs/gateway
          cp -r ".regression/openclaw-$OPENCLAW/state/logs" .regression/logs/gateway/state-logs 2>/dev/null || true
          cp "${TMPDIR:-/tmp}"/openclaw/*.log .regression/logs/gateway/ 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-logs-${{ matrix.version }}
          path: .regression/logs
          if-no-files-found: ignore
          retention-days: 7

  summary:
    needs: [resolve, gateway]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      results: ${{ steps.summary.outputs.results }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: regression-result-*
          path: results
          merge-multiple: true
      - id: summary
        name: Results per version
        env:
          VERSIONS: ${{ needs.resolve.outputs.versions }}
        run: |
          shopt -s nullglob
          files=(results/result-*.json)
          # One row per resolved version, in the requested order; a job that wrote no result (cancelled, timed out) shows so.
          results="$(jq -c -s --argjson versions "$VERSIONS" '. as $rows | $versions | map(. as $v | (($rows | map(select(.version == $v.version)) | first) // {version: $v.version, result: "no result", failed: []}) + {requests: $v.requests})' /dev/null "${files[@]}")"
          echo "results=$results" >>"$GITHUB_OUTPUT"
          {
            echo "### Gateway regression tier"
            echo
            echo "| Requested | OpenClaw | Result | Time | Plugin sha256 |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.requests | join(", ")) | \(.version) | \(.result) | \(if (.seconds | type) == "number" then "\(.seconds / 60 | floor)m \(.seconds % 60)s" else "-" end) | \(if .sha256 then "`\(.sha256)`" else "-" end) |"' <<<"$results"
            jq -r '.[] | select((.failed // []) | length > 0) | "\nFailing on OpenClaw \(.version):\n", (.failed[] | "- `\(gsub("`"; "'"'"'"))`")' <<<"$results"
          } >>"$GITHUB_STEP_SUMMARY"
