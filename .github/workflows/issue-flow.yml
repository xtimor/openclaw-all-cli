name: Issue flow

# State automation for issues, with no model: keeps one status:* label on every open issue and makes the moves
# that need no judgment (design: _bmad-output/.../epic-distribution/issue-flow.md; user doc: docs/issues.md).
# All decisions are in scripts/issue-flow/transitions.mjs (pure, tested); scripts/issue-flow/apply.mjs applies them.
# pull_request_target runs the base branch's code and reads only the PR number, body, and merged flag: it never
# checks out or runs PR code. Issue and PR text is data and is never put into a command or an expression.
# No concurrency group: GitHub keeps only one pending run per group and would drop events. Runs may overlap; the
# status is always settled from the issue's current labels and label timeline, so parallel runs converge.
# Events made with GITHUB_TOKEN (this workflow's own) start no workflow; the bot guard is defense only. The issue agents'
# events (their GitHub App token, or the owner's connector) do start it, like a person's, and are reconciled here.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, reopened, closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the stale issues; change nothing
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: read
  contents: read

env:
  # Logins (comma separated) allowed to set status:approved or status:rework (the owner's own click). Anyone else's is removed again. Keep in sync with
  # ISSUE_FLOW_OWNERS in agent-write.yml (the logins allowed to dispatch the agents' write relay).
  ISSUE_FLOW_OWNERS: xtimor
  # Logins (comma separated) of the issue agents' GitHub App, as `<app-slug>[bot]` (docs/agents/identity.md). Only effect: an
  # agent's marker comment is never an author's reply (matters when the app opened the issue). The app's approval is reverted
  # because it is not in ISSUE_FLOW_OWNERS. Empty: the agents act as the owner.
  ISSUE_FLOW_AGENTS: "openclaw-all-cli-agent[bot]"

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Default ref: the repository's default branch for issues, schedule, and dispatch, and the PR's base branch
      # for pull_request_target; never the PR's own code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the event
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { runEvent } = await import('${{ github.workspace }}/scripts/issue-flow/apply.mjs');
            await runEvent({ github, context, core });
      - name: Close stale needs-info and declined issues
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        with:
          script: |
            const { runStale, isDryRun } = await import('${{ github.workspace }}/scripts/issue-flow/apply.mjs');
            await runStale({ github, context, core, dryRun: isDryRun(context.eventName, process.env.DRY_RUN_INPUT) });
