title = "Session resume, live-process reuse, and side questions"
description = "Resumes from ctx.sessionId and useResume via ACP session/load, emits new native IDs, reuses a live process only when model, mode, cwd, home, auth profile, and session match, and runs side questions in ACP ask mode; parity rows P4, P5, P18. Uncertain: whether two processes can resume one chat (spec Q4)."
verify = "A follow-up turn answers about the first with only the new prompt sent, also after a Gateway restart; `/reset` starts a fresh chat; another agent cannot resume this agent's chat; a side question runs without tools."
