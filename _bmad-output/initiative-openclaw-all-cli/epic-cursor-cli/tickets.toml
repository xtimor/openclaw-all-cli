hitl = false
risk = "medium"
references = ["architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-5", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-13"]

[[entry]]
id = 8
type = "story"
title = "Concurrency caps and operations"
description = "Adds per-backend turn and process caps, binary detection (runtimeArtifact), the version floor and ACP protocol check, clearEnv, honoring timeoutMs and reliability.watchdog, pid lock files with stale reaping, the idle timeout, and close-all on unload; builds AD-8's fallback lane if entry 1 found liveSession rejected; parity rows P17, P19."
verify = "Two agents run 20 turns each in parallel without error while a second turn in one session waits for the first; a killed Gateway leaves no cursor-agent process after restart; an old cursor-agent fails with unsupported_version."
covers = ["CAP-9"]
after = [4, 7]
hitl = false
risk = "medium"
references = ["architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-8", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-11", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-14"]

[[entry]]
id = 10
type = "story"
title = "Per-turn usage on the transcript"
description = "Emits the usage event so OpenClaw records input, output, and cache tokens per turn; parity row P16. Source found after entry 9 (see its Addendum): Cursor's server-side usage ledger (api2.cursor.sh GetFilteredUsageEvents, keyed by the ACP sessionId = conversationId), exact and matching -p to the token; falls back to no usage (or the store estimate) on any failure. Undocumented RPC, so it must degrade quietly; team accounts may need teamId."
verify = "The assistant transcript entry of a live turn carries input, output, and cache token counts matching Cursor's numbers for that turn."
covers = ["CAP-3"]
after = [2, 9]
hitl = false
risk = "low"

