[[entry]]
id = 2
type = "story"
title = "Per-agent Cursor home with static permissions"
description = "Derives each agent's Cursor home from agentDir, points CURSOR_CONFIG_DIR and CURSOR_DATA_DIR at it, writes the AD-9 static permissions once with atomic rename (allowing MCP server `openclaw`), and rejects every ACP permission request by default until entry 4; parity row P8 (deny side)."
verify = "Two agents get separate homes with the AD-9 permissions, and a turn asking to write, edit, or delete a file is denied while read and grep still work."
covers = ["CAP-7", "CAP-8"]
after = [1]
hitl = false
risk = "medium"
references = ["architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-6", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-7", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-9"]

[[entry]]
id = 3
type = "story"
title = "OpenClaw tools through the per-session MCP proxy"
description = "Enables bundleMcp in gemini-system-settings mode, runs the core's stable MCP proxy per live session as server `openclaw`, and forwards each turn to that turn's loopback URL and headers read from the execute env; parity row P7. Uncertain: whether the settings file always carries the URL and headers."
verify = "A live test calls an OpenClaw tool on two consecutive turns of one warm session and both reach OpenClaw with that turn's token; a call outside a turn is rejected."
covers = ["CAP-6"]
after = [2]
hitl = false
risk = "high"
references = ["architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-9", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-12"]

[[entry]]
id = 4
type = "story"
title = "Permission routing, tool availability, and abort"
description = "Replaces entry 2's default rejection by routing ACP permission requests to ctx.requestToolPermission, declares selectable tools with prepare-execution enforcement, answers pending requests cancelled on abort, and updates parity rows P8, P9, P10 (P10's mechanism per AD-9). Uncertain: whether ACP edits can be made to ask."
verify = "A shell request rejected by OpenClaw makes the model fall back to OpenClaw exec, a tools.deny tool is absent from the model's list, and aborting mid-approval ends the turn cleanly."
covers = ["CAP-6", "CAP-7"]
after = [3]
hitl = false
risk = "medium"
references = ["architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-9", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-11"]

