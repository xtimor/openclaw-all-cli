[[entry]]
id = 1
type = "story"
title = "Walking skeleton: one cursor-cli reply in an isolated OpenClaw"
description = "Scaffolds the repo (package.json, openclaw.plugin.json with configSchema, vitest, gated test/live harness, docs/providers/cursor.md skeleton, dev OpenClaw script) and the core contracts (ports.ts adapter interface, NormalizedEvent, CliError, manifest skeleton P1-P19), then registers cursor-cli with synthetic auth, liveSession, and a custom execute that sends one prompt over the generic ACP session."
verify = "In the isolated OpenClaw, `openclaw agent --model cursor-cli/auto --message 'Say hi'` prints Cursor's reply; an import-boundary test passes (AD-2); the plan records whether liveSession, synthetic auth, and plugin startup loading (#148584) worked."
covers = ["CAP-1", "CAP-12"]
after = []
hitl = false
risk = "high"
references = ["architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-1", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-2", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-3", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-4", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-8", "architecture-openclaw-all-cli/architecture-openclaw-all-cli.md#ad-10"]

[[entry]]
