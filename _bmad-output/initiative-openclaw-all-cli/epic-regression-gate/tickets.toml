type = "story"
title = "Live tier in GitHub Actions with the real cursor-agent"
description = "Adds a `live` job to `regression.yml`, bound to the environment `regression` with `CURSOR_API_KEY` and dispatchable on its own: the existing `test/live/` suite plus model-behavior scenarios (#76 exec, #75 GPT structured output, first-reply time against a budget, Test connection, quota), each up to 3 tries, with a per-run time and turn cap; ledger entries (tier live) for those bugs; the job summary shows results with tries, timings, and Cursor tokens from the usage ledger. Measures one full run's time and tokens and records them in MEMORY.md."
