[[entry]]
id = 1
type = "story"
title = "Regression ledger: one entry and one test per past bug"
description = "Adds `test/regression/ledger.toml` with one entry per closed `type:bug` issue (number, family, tier unit|gateway|ui|live, test file and test name, whether the test reproduces the original conditions or only a unit-level proxy), backfilled for all past bugs, and a vitest check that fails when a ledger test is missing or a bug fix PR's issue has no entry; the agent rules (`docs/agents/implement.md`, `_bmad/custom/bmad-build*.toml`) require every bug fix to add its entry and a test at the tier where the bug showed, proved red before the fix."
verify = "`npx vitest run test/regression/ledger.test.ts` passes on main, fails when an entry is removed or names a missing test (mutation), and the ledger lists every closed `type:bug` issue at the time of the build."
covers = []
after = []
hitl = false
risk = "low"
references = ["epic-regression-gate.md", "../change-pre-release-regression-gate/change-pre-release-regression-gate.md"]

[[entry]]
id = 2
type = "story"
title = "Gateway tier harness: packed plugin, fresh OpenClaw, real Gateway, scripted Cursor"
description = "Adds `scripts/regression.sh` and a vitest project `test/regression/gateway/` that pack the plugin, install the `.tgz` into a throwaway OpenClaw state for a given `OPENCLAW_VERSION`, configure `cursor-cli.command` to `fake-cursor-agent`, start a Gateway, and drive turns over the Gateway API (`openclaw agent` and `chat.send`); `fake-cursor-agent` gains the hooks scenarios need (log each prompt's text, the permission file and mode it was started with; scripted replies and errors per scenario). One tracer scenario proves the chain."
verify = "`scripts/regression.sh gateway` on OpenClaw 2026.10.3 and latest runs the tracer scenario green with no secret, and fails when the plugin's backend registration is broken (mutation)."
covers = []
after = [1]
hitl = false
risk = "medium"
references = ["epic-regression-gate.md"]

[[entry]]
id = 3
type = "story"
title = "Gateway scenarios for every past bug a scripted Cursor can show"
description = "Adds Gateway-tier scenarios that recreate the conditions of past bugs and records them in the ledger: #13 reply shown once, #14 no backend clash, #12/#46 per-model context window, #40/#97 context tile monotonic over turns, #67 empty native selection runs, #74 no leftover process, #11/#38 one cursor-agent per chat across turns, #76 shell note reaches the CLI in agent mode and the ask-mode counterpart (#102, red until its fix lands, marked expected-red with the issue number), #99 throttle vs quota, #98 bad key not authenticated, #39 card state, Test connection, managed install and Remove key, #80 update instructions."
verify = "Each scenario fails when its fix is reverted in a scratch copy (mutation per scenario, recorded in the plan), passes on main, and has a ledger entry with tier gateway."
covers = []
after = [2]
hitl = false
risk = "medium"
references = ["epic-regression-gate.md"]

[[entry]]
id = 4
type = "story"
title = "OpenClaw version matrix in CI and a weekly beta run"
description = "Runs the Gateway tier in `ci.yml` on OpenClaw min (from `package.json` compat) and npm `latest`, and in `release.yml` on min, `extended-stable`, and `latest`, resolved at run time and printed in the summary; adds a weekly workflow on OpenClaw `beta` that opens an issue when red."
verify = "A pull request shows the Gateway tier as separate green jobs per version, the resolved versions appear in the summary, and a dispatch of the weekly workflow runs on the current beta."
covers = []
after = [2]
hitl = false
risk = "low"
references = ["epic-regression-gate.md"]

