[[entry]]
id = 2
type = "story"
title = "Gateway tier harness: packed plugin, fresh OpenClaw, real Gateway, scripted Cursor"
description = "Adds `scripts/regression.sh` and `test/regression/gateway/` (`*.regression.test.ts`, gated by `OPENCLAW_ALL_CLI_REGRESSION=1` the way `describeLive` gates live tests, so `npm test` stays offline and fast) that pack the plugin, install the `.tgz` into a throwaway OpenClaw state for a given `OPENCLAW_VERSION`, configure `cursor-cli.command` to `fake-cursor-agent`, start a Gateway, and drive turns over the Gateway API (`openclaw agent` and `chat.send`); `fake-cursor-agent` gains the hooks scenarios need (log each prompt's text, the permission file and mode it was started with; scripted replies and errors per scenario). One tracer scenario (a plain turn returns one reply) proves the chain."
verify = "`scripts/regression.sh gateway` on OpenClaw 2026.10.3 and latest runs the tracer scenario green with no secret, fails when the plugin's backend registration is broken (mutation), and `npm test` neither runs nor slows down because of it."
covers = []
after = []
hitl = false
risk = "medium"
references = ["epic-regression-gate.md"]

[[entry]]
id = 1
type = "story"
title = "Regression ledger: one entry and one test per past bug"
description = "Adds `test/regression/ledger.toml`, a committed list with one entry per closed `type:bug` issue (number, family, tier unit|gateway|ui|live, test file and test name, `reproduces` true when the test recreates the original conditions or false for a unit-level proxy), backfilled for all past bugs; `test/regression/ledger.test.ts` (offline, in `npm test`) fails when an entry names a missing file or test name; a CI step with the workflow's `GITHUB_TOKEN` (skipped locally without it) fails when a closed `type:bug` issue has no entry. The agent rules (`docs/agents/implement.md`, `_bmad/custom/bmad-build.toml` and `bmad-build-auto.toml`) require every bug fix to add its entry and a test at the tier where the bug showed, proved red before the fix."
verify = "`npx vitest run test/regression/ledger.test.ts` passes on main and fails when an entry names a missing test (mutation); the CI step fails when an entry for a closed bug is removed (mutation, run in a scratch copy with a stub issue list)."
covers = []
after = []
hitl = false
risk = "low"
references = ["epic-regression-gate.md", "../change-pre-release-regression-gate/change-pre-release-regression-gate.md"]

[[entry]]
