[[entry]]
id = 7
type = "story"
title = "The release gate: nothing publishes while a tier is red"
description = "`release.yml` calls `regression.yml` (Gateway and Control UI tiers on the full matrix, the live tier) against the exact `.tgz` it will publish, before `npm publish`; any red stops the run before publishing; a dry run runs the same; an override input exists only for the live tier and needs a reason that goes into the release notes; one combined release summary shows results, timings, and Cursor tokens across tiers; `docs/release.md` says so."
verify = "A release dry run with a deliberately red scenario publishes nothing and fails, the same run green reaches the publish dry run with the combined summary, and the override writes its reason into the notes."
covers = []
after = [3, 5, 6, 9]
hitl = false
risk = "high"
references = ["epic-regression-gate.md"]

