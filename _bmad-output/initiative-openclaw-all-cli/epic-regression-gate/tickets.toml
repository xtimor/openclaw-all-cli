title = "Gateway scenarios for past turn, process, and prompt bugs"
description = "Adds Gateway-tier scenarios recreating the conditions of past turn-level bugs, each with its ledger entry (tier gateway): #13 reply shown once over `chat.send`, #14 no backend clash, #12/#46 per-model context window, #40/#97 usage reading monotonic over turns, #67 empty native selection runs, #74 no leftover process after the chat ends, #11/#38 one cursor-agent per chat across turns, #76 the shell note reaches the CLI in agent mode, #99 throttle reported as retryable not as spent quota. The #102 scenario is not added here: the #102 bug ticket adds it with its fix (ledger rule from entry 1)."
verify = "Each scenario fails when its fix is reverted in a scratch copy (one mutation per scenario, recorded in the plan), passes on main, and has a ledger entry with tier gateway."
covers = []
after = [1, 2]
hitl = false
risk = "medium"
references = ["epic-regression-gate.md"]

