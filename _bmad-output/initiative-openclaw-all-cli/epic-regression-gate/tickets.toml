[[entry]]
id = 5
type = "story"
title = "Live tier in GitHub Actions with the real cursor-agent"
description = "Runs the live suite plus model-behavior scenarios (#102 write in ask mode on grok-4.7, #76 exec, #75 GPT structured output, first-reply time against a budget, Test connection, quota) in a job bound to the environment `regression` with `CURSOR_API_KEY`; each scenario up to 3 tries; a per-run time and turn cap; the summary shows results, timings, and Cursor tokens from the usage ledger. Measures one full run's time and tokens."
verify = "A dispatched run with the key passes or fails per scenario with tries shown, the summary prints total time and tokens, and a run without the key fails fast with a clear message."
covers = []
after = [3]
hitl = true
risk = "high"
references = ["epic-regression-gate.md"]

[[entry]]
id = 7
type = "story"
title = "The release gate: nothing publishes while a tier is red"
description = "`release.yml` runs the Gateway and Control UI tiers on the full matrix and the live tier against the exact `.tgz` it will publish, before `npm publish`; any red stops the run before publishing; a dry run runs the same; an override input exists only for the live tier and needs a reason that goes into the release notes; `docs/release.md` and epic-distribution's Done when 1 say so."
verify = "A release dry run with a deliberately red scenario publishes nothing and fails, the same run green reaches the publish dry run, and the override writes its reason into the notes."
covers = []
after = [4, 5, 6]
hitl = false
risk = "high"
references = ["epic-regression-gate.md"]

[[entry]]
id = 8
type = "story"
title = "The release loop: regression, fix batch, regression again until green"
description = "On the owner's \"release\", the agent dispatches the full regression on main's head; each red scenario becomes a `type:bug` issue (`source:regression`, run link, no triage step: the owner's release is the approval); one BMAD batch fixes them with ledger entries; after the merge the regression runs again; green publishes the tested `.tgz`; 3 red rounds or a flake stops the loop with a report to the owner. Documented in `docs/release.md` For agents."
verify = "A rehearsal on a branch with one injected bug goes red, files one issue, the fix batch turns it green on the next round, and the loop then reaches the publish dry run; a forced third red stops with the report."
covers = []
after = [7]
hitl = false
risk = "high"
references = ["epic-regression-gate.md"]
