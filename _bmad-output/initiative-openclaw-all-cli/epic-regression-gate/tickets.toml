[[entry]]
id = 8
type = "story"
title = "The release loop: regression, fix batch, regression again until green"
description = "On the owner's \"release\", the agent dispatches a release dry run on main's head (the same `release.yml` with the gate); each red scenario becomes a `type:bug` issue with the new label `source:regression` (added to `.github/labels.yml`) and the run link; these skip triage and the owner's own-click approval because the owner's \"release\" is the approval (`docs/agents/implement.md` says so); one BMAD batch fixes them with ledger entries; after the merge the dry run repeats; green dispatches the real release, which runs the gate again on the same commit before it publishes; 3 red rounds or a flake stops the loop with a report to the owner. Documented in `docs/release.md` For agents."
verify = "A rehearsal on a branch with one injected bug, on the offline tiers plus one live scenario, goes red, files one issue, the fix batch turns it green on the next round, and the loop then reaches the publish dry run; a forced third red stops with the report."
covers = []
after = [10]
hitl = false
risk = "high"
references = ["epic-regression-gate.md"]
