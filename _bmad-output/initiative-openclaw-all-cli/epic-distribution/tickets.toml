[[entry]]
id = 14
type = "story"
title = "Issue agents act as their own GitHub App, not as the owner"
description = "Owner's decision (2026-10-23): the triage and implementation agents write to GitHub as a GitHub App the owner creates and installs on this repository only (shown as `<app-slug>[bot]`), not through the owner's connector. A small agent-neutral script mints a short-lived installation token from environment variables the owner sets in the cloud environment of the routine (`AGENT_APP_ID`, `AGENT_APP_PRIVATE_KEY_B64`; never printed or logged), and the agents use it with `gh` for every GitHub write (comments, labels, issue state, pull requests, merges); reads may use either. `ME` becomes the app's bot login; the owner list stays the owner's. The state automation treats marker comments by an agent login (new workflow setting `ISSUE_FLOW_AGENTS`) like an owner's, the batch-PR merge rule requires the PR author to be the agent login, and the owner-only approval rule is unchanged (the app's `status:approved` is reverted like anyone's). Without the variables the agents keep working as today (owner identity) and say so in the report. Docs: a setup section (create the app, permissions, install, generate the key, set the variables) in `docs/issues.md` or a new `docs/agents/identity.md`."
verify = "Unit tests for the token script (JWT claims and signing with a test key, installation lookup, error on missing variables, the key never in output) and for `ISSUE_FLOW_AGENTS` in the state automation; `npm run ci` passes; live: after the owner sets the variables, a routine run's comments, labels, and batch PR show the app's bot login."
