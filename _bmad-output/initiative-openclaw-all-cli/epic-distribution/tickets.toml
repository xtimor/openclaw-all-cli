[[entry]]
id = 15
type = "story"
title = "Agent writes go through a GitHub Actions relay that acts as the agent app"
description = "Owner's decision (2026-10-23), after the live finding that the cloud session proxy swaps in the owner's GitHub credentials (ticket 3.14, Plan Change Log): the agents do not write to GitHub themselves when the app is set up. They dispatch a workflow `Agent write` (`.github/workflows/agent-write.yml`, `workflow_dispatch` on `main`) with one JSON list of operations; the workflow mints an installation token with `scripts/agent-token.mjs` from the repository variable `AGENT_APP_ID` and the secret `AGENT_APP_PRIVATE_KEY` (raw PEM), and a tested script `scripts/agent-write.mjs` applies the operations in order through the REST API as `<app-slug>[bot]`. Operations: comment, edit own comment, add/remove labels, close/reopen with a reason, create/ready/edit a pull request from a `claude/` branch, merge a pull request with the expected head sha. Guards in the script, not only in prompts: only this repository; the dispatcher (`github.actor`) must be in `ISSUE_FLOW_OWNERS`; never adds `status:approved`; merges only an open, non-draft PR whose author is the app, head branch `claude/...`, title starting `Issue batch`, with the given sha; bounded size of the list. The run summary lists what was applied, and the bot login. The agents (triage.md, implement.md, identity.md) use the relay when the repository variable `AGENT_APP_ID` is set (read it with a repository-scoped API call), wait for the run to finish (`gh run watch`), and read the result back by REST; otherwise they write as the owner as before. The session-side mint and the `AGENT_APP_*` cloud variables are dropped from the docs. `ISSUE_FLOW_AGENTS` gets the bot login once known."
verify = "Unit tests for `scripts/agent-write.mjs` against a local API stub: each operation's REST call, order kept, dispatcher not an owner refused, `status:approved` refused, merge guards (author, branch, title, draft, sha), oversize list refused, no token in output; `npm run ci` passes; live: a dispatched `Agent write` run posts a comment on a test issue as the app's bot login and its summary names the bot."
covers = []
after = [14]
hitl = false
risk = "high"
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
