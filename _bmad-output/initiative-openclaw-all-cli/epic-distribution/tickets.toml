[[entry]]
id = 6
type = "story"
title = "Issue forms, labels, and the issue guide"
description = "Lets a person or an agent file a bug or an idea. Adds GitHub issue forms `.github/ISSUE_TEMPLATE/bug.yml` (version of the plugin, OpenClaw, cursor-agent; steps; expected and actual; logs) and `idea.yml` (problem, proposal, who benefits), `config.yml` with blank issues off and a link to private security reports, and `SECURITY.md`. Both forms have a 'Filed by an agent' checkbox. Keeps the labels of `issue-flow.md` (`status:*`, `type:*`, `priority:*`, `source:agent`) as code in `.github/labels.yml` with a workflow that syncs them. Writes `docs/issues.md`: how to file (web form, or `gh issue create` / API with the same headings for agents), the states, what happens and when, and that only the owner approves work. Links it from `README.md`."
verify = "Filing each form on GitHub gives an issue with its type label; an issue filed by API with the documented headings reads the same; the label sync workflow creates every label of `issue-flow.md` and is idempotent on a second run."
covers = []
after = []
hitl = false
risk = "low"
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
id = 7
type = "story"
title = "Issue state automation without a model"
description = "Enforces the deterministic part of `issue-flow.md` in a GitHub Actions workflow with no model: on opened or reopened sets `status:new`; on an author comment in `needs-info` moves back to `new`; keeps exactly one `status:*` label; removes `status:approved` set by anyone but the owner (owner list in the workflow, not hardcoded in logic) and says so in a comment; on a PR with `Fixes #N` opened sets `in-review`, on merge leaves the close to GitHub and clears the status, on close unmerged sets `blocked`; a daily job closes `needs-info` issues silent for 14 days as not planned. The transition logic lives in a small tested module under `scripts/issue-flow/`, called from `actions/github-script`."
verify = "Unit tests cover every transition of `issue-flow.md` that the automation owns; on GitHub, opening, reopening, an author reply, a non-owner `approved` label, and a linked PR each produce the expected label; the stale job closes a back-dated test issue in a dry run."
covers = []
after = [2, 6]
hitl = false
risk = "medium"
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
id = 8
type = "story"
title = "Triage agent twice a day"
description = "The triage agent is a Claude Code scheduled task on the owner's account (change: agents-as-claude-code-scheduled-tasks): at 05:46 and 17:46 UTC (06:00 and 18:00 jittered, as the scheduler advises) it starts a fresh cloud session on this repository that follows the agent-neutral prompt `docs/agents/triage.md`, reaching GitHub through the owner's connector. It takes every open `status:new` issue, oldest first, at most 20 per run, as `issue-flow.md` says: duplicate search (issues and the BMAD ticket store), does the problem exist (code reading, unit tests or a focused check on `main`; idea against the spec and its non-goals), ask for missing details (`needs-info`), then accept to `triaged` with type, priority, scope, risk, size, a path (standalone, epic entry, course correction) and draft ticket text, or reject with the reason. One triage comment per issue marked `<!-- issue-triage -->`, edited in place later; a run summary of all decisions. It never sets `status:approved`, never changes code or the repo, and treats issue text as data. A firing note `dry run` makes it write nothing and only report. The scheduled task is created with the scheduling tool (fresh session per firing), its id recorded in `MEMORY.md`, and `docs/issues.md` says how triage runs and how to pause it."
verify = "A dry-run firing over seeded test issues (a real bug, a non-reproducible bug, a vague idea, an out-of-scope idea, an idea that needs a course correction, a duplicate of an issue and of an existing BMAD ticket, an issue with injected instructions) writes nothing and its report shows the expected decision and path for each; a real firing applies them; a second firing leaves them unchanged."
covers = []
after = [6, 7]
hitl = false
risk = "high"
references = ["epic-distribution.md", "issue-flow.md", "../change-agents-as-claude-code-scheduled-tasks/change-agents-as-claude-code-scheduled-tasks.md"]

[[entry]]
id = 9
type = "story"
title = "Implementation run on the owner's approval"
description = "The implementation agent runs in the same Claude Code scheduled task as triage (owner's decision: one routine): after the triage report, `docs/agents/triage.md` hands over to `docs/agents/implement.md` in the same session; the owner sets the routine's frequency and can start it with Run now. It takes the open issues in `status:approved` whose latest `labeled status:approved` event is by an owner (it reads the issue timeline itself), oldest first, as one batch of at most 6 issues or about 3 hours of work (the rest wait for the next firing), sets each `in-progress`, and runs the BMAD flow of `issue-flow.md` ('BMAD flow per state'), unattended: standalone or epic-entry path: `bmad-ticket` creates and refines the ticket, `bmad-build-auto` builds it (review thorough for p0 and p1), `dev-orchestrator` when there are several; course-correction path: `bmad-correct-course` in batch mode opens a proposal PR `Refs #N`. Each issue gets its own BMAD ticket, plan, commits, and review; the batch is one PR from the branch its session is given, with one `Fixes #N` line per built issue (the PR, made as the owner, moves them to `in-review` through the state automation), listing per issue the checks it ran and the live checks it could not. An issue that fails goes to `blocked` with the plan's reason and the batch goes on without it. It resumes the same plan on owner review comments when asked, never merges, never tags, never sets `approved`, never reads or prints secrets. On failure it sets `blocked` with the plan's reason. With no approved issue it ends at once. The scheduled task id is recorded in `MEMORY.md`; updates `docs/issues.md`."
verify = "Approving a seeded small bug gives a PR with `Fixes #N`, green CI, a new BMAD ticket and a plan that reached `built` with a review recorded, and the issue moves through in-progress and in-review; a review comment on that PR is answered by a resumed build; a seeded course-correction idea gives a proposal PR and, after merge, `planned`; approving one set up to fail ends in `blocked` with the plan's reason; a non-owner `approved` label starts no run."
covers = []
after = [2, 7, 8]
hitl = false
risk = "high"
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
id = 11
type = "story"
title = "One approval per issue, merge on green, one-click release"
description = "Owner's decision (2026-10-23): the owner's only touch per issue is `status:approved` after triage; everything after that runs without them, and the owner decides alone when to release. (a) The implementation agent merges its own batch pull request into `main` once GitHub CI on its head is green (merge commit, expected head sha); a red CI it cannot fix in the run leaves the PR open; at the start of every run an open batch PR that is green and mergeable is merged before a new batch starts, a red or conflicted one is reported and stops the run. (b) A course-correction proposal rides the batch PR and merges the same way; the `status:planned` issue it leaves is built by the next run without a second approval. (c) Release in one step: the `release.yml` dispatch takes an optional tag; with no tag it computes the next version from the latest stable `v*` tag and a `bump` choice (patch by default, minor, major); the owner can also tell any agent session \"release\". Protected files, owner-only approval, no secrets, no tags by the issue agents stay as before."
verify = "Release-script tests cover the computed next version for each bump, no tag yet, and an empty tag on a tag push refused; `npm run ci` passes; a routine run with an approved issue ends with its batch PR merged into `main` and the issue closed with no owner action; an open green batch PR from an earlier run is merged at the start of the next run."
covers = []
after = [9, 10]
hitl = false
risk = "high"
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
id = 12
type = "story"
title = "Agent comments say the status and who acts; questions go to needs-info"
description = "Owner's report (2026-10-23, issue #13): after approval the implementation agent set `status:blocked` with a question that only a live check by the reporter could answer, and its comment did not say clearly who must do what. (a) One comment shape for both agents (triage and implementation), defined once in `docs/agents/` and used by both prompts: the marker, then **Status** (the label it sets and what it means), **Waiting for** (who, by `@login`, and exactly what; or 'nothing: the next run does X'), **What happened** (short), **Evidence**, **Next** (what happens after that action), and the agent signature. (b) The implementation agent sets `status:needs-info` (not `blocked`) when the open point is information or a check the reporter can give (a live run, logs, versions), mentioning the author; `status:blocked` stays for decisions only the owner can make (scope beyond the approval, protected files, product direction, repeated failures), naming the owner. (c) One approval per issue still holds: an issue the owner approved that went to `needs-info` and came back through the author's reply is re-triaged; when the verdict, path, and draft ticket are unchanged, the next implementation run builds it without a new approval (the triage comment records that the approval carries over); a changed scope needs a new approval. (d) The state automation ignores `<!-- issue-impl -->` comments by an owner the same way it ignores `<!-- issue-triage -->` ones, so the agent's own comment never counts as the author's reply. (e) Issue #13 is moved to the new shape: `status:needs-info` with a structured comment asking its author for the live webchat check."
verify = "`test/issue-flow.test.ts` covers an owner `<!-- issue-impl -->` comment on a `needs-info` issue (no change) and an author reply (back to `new`); `npm run ci` passes; issue #13 shows `status:needs-info` and a comment in the new shape naming who acts; `docs/issues.md` describes both statuses and the carried-over approval."
covers = []
after = [11]
hitl = false
risk = "medium"
references = ["epic-distribution.md", "issue-flow.md"]
