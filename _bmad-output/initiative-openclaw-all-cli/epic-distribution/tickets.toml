[[entry]]
id = 1
type = "story"
title = "Readable settings form in the Control UI"
description = "Adds `uiHints` to `openclaw.plugin.json` so the Control UI form for `plugins.entries.openclaw-all-cli.config` has a label and help text for `cursor-cli.command`, `cursor-cli.env`, `cursor-cli.maxConcurrentTurns`, and `cursor-cli.maxProcesses`; marks the API key sensitive (the `env` map holds `CURSOR_API_KEY`, so decide in the plan how a map value can be marked, or give the key its own field if the schema allows it without breaking the existing config); puts the two limits under advanced; checks that `config.schema` of a running isolated Gateway returns the hints. Keeps every existing config key valid."
verify = "In the isolated OpenClaw, `config.schema` returns `uiHints` with a label and help for each field, the API key is marked sensitive, and an existing config with the old keys still loads; a short note in `docs/setup.md` names the form."
covers = []
after = []
hitl = false
risk = "low"
references = ["epic-distribution.md"]

[[entry]]
id = 2
type = "story"
title = "CI on pull requests"
description = "Adds a GitHub Actions workflow for pull requests and pushes to main: Node 24, npm install, link OpenClaw 2026.10.3 types, typecheck, `npm test`, build, `npm pack --dry-run`, and an install smoke check of the packed tarball into a throwaway OpenClaw state. Live tests (real Cursor) stay out of CI. Caches npm. Pins action versions. Records the commands in `docs/` so a contributor can run the same locally."
verify = "A pull request with the change shows the workflow green on GitHub; a deliberate type error turns it red; the workflow needs no secret."
covers = []
after = []
hitl = false
risk = "low"
references = ["epic-distribution.md"]

[[entry]]
id = 3
type = "story"
title = "A package that npm can publish"
description = "Makes the package publishable: drops `private`, settles name and scope, adds `repository`, `homepage`, `bugs`, `keywords`, a `files` list that ships only `dist/`, `openclaw.plugin.json`, `README.md`, and `LICENSE`, the `openclaw` compat block, and `publishConfig` (public access, provenance). Gives the version a single source (the git tag drives it in CI). Checks `npm pack` contents against an allowlist test, and that the tarball installs with `openclaw plugins install` in the isolated OpenClaw. Rewrites `README.md` for the npm page."
verify = "`npm pack --dry-run` lists exactly the allowlisted files; a test fails when a file outside the list would ship; the packed tarball installs and runs a turn in the isolated OpenClaw."
covers = []
after = [2]
hitl = false
risk = "medium"
unknown = "The npm package name and scope, and whether the name is free on npmjs.com."
references = ["epic-distribution.md"]

[[entry]]
id = 4
type = "story"
title = "Release workflow: tag to npmjs.com"
description = "Adds a GitHub Actions release workflow triggered by a tag `vX.Y.Z`: verifies the tag matches the version, runs the same checks as entry 2, builds, publishes to npmjs.com with provenance (npm trusted publishing over OIDC if the account allows it, else an `NPM_TOKEN` secret), creates a GitHub release with the `.tgz` attached and generated notes. Has a manual dry-run mode that stops before publish. Writes `docs/release.md`: cut a release, roll back (deprecate, not unpublish), rotate the credential."
verify = "A dry run on a throwaway tag shows every step green and publishes nothing; the first real tag publishes the package and the GitHub release shows the same tarball hash."
covers = []
after = [3]
hitl = true
risk = "high"
unknown = "Who owns the npm account and scope, and whether trusted publishing or a token is used; the owner creates the credential and the repository secret."
references = ["epic-distribution.md"]

[[entry]]
id = 5
type = "story"
title = "Install from npm proven and documented"
description = "After the first release: in an isolated OpenClaw, `openclaw plugins install` of the published package (npm spec) gives a working `cursor-cli` turn with an OpenClaw tool call, then `openclaw plugins update` takes a newer version. Rewrites `docs/setup.md` so step 2 is the one-line npm install (build-from-source moves to a contributor section), updates `README.md`, and replaces the manual tarball steps given to the user."
verify = "On a clean isolated OpenClaw an agent following only `docs/setup.md` installs from npm and gets a working turn; `plugins update` moves to the next published version."
covers = []
after = [4]
hitl = false
risk = "medium"
references = ["epic-distribution.md"]

[[entry]]
id = 6
type = "story"
title = "Issue forms, labels, and the issue guide"
description = "Lets a person or an agent file a bug or an idea. Adds GitHub issue forms `.github/ISSUE_TEMPLATE/bug.yml` (version of the plugin, OpenClaw, cursor-agent; steps; expected and actual; logs) and `idea.yml` (problem, proposal, who benefits), `config.yml` with blank issues off and a link to private security reports, and `SECURITY.md`. Both forms have a 'Filed by an agent' checkbox. Keeps the labels of `issue-flow.md` (`status:*`, `type:*`, `priority:*`, `source:agent`) as code in `.github/labels.yml` with a workflow that syncs them. Writes `docs/issues.md`: how to file (web form, or `gh issue create` / API with the same headings for agents), the states, what happens and when, and that only the owner approves work. Links it from `README.md`."
verify = "Filing each form on GitHub gives an issue with its type label; an issue filed by API with the documented headings reads the same; the label sync workflow creates every label of `issue-flow.md` and is idempotent on a second run."
covers = []
after = []
hitl = false
risk = "low"
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
id = 7
type = "story"
title = "Issue state automation without a model"
description = "Enforces the deterministic part of `issue-flow.md` in a GitHub Actions workflow with no model: on opened or reopened sets `status:new`; on an author comment in `needs-info` moves back to `new`; keeps exactly one `status:*` label; removes `status:approved` set by anyone but the owner (owner list in the workflow, not hardcoded in logic) and says so in a comment; on a PR with `Fixes #N` opened sets `in-review`, on merge leaves the close to GitHub and clears the status, on close unmerged sets `blocked`; a daily job closes `needs-info` issues silent for 14 days as not planned. The transition logic lives in a small tested module under `scripts/issue-flow/`, called from `actions/github-script`."
verify = "Unit tests cover every transition of `issue-flow.md` that the automation owns; on GitHub, opening, reopening, an author reply, a non-owner `approved` label, and a linked PR each produce the expected label; the stale job closes a back-dated test issue in a dry run."
covers = []
after = [2, 6]
hitl = false
risk = "medium"
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
id = 8
type = "story"
title = "Triage agent twice a day"
description = "Adds a scheduled GitHub Actions workflow (06:00 and 18:00 UTC, plus manual dispatch with a dry-run switch) that runs a coding agent over every open `status:new` issue, oldest first, at most 20 per run, as `issue-flow.md` says: duplicate search, does the problem exist (code reading, unit tests or a focused check on `main`; idea against the spec and its non-goals), ask for missing details, then accept to `triaged` with type, priority, scope, risk, and size, or reject with the reason. One triage comment per issue marked `<!-- issue-triage -->`, edited in place later; a job summary of all decisions. The prompt lives in the repo as an agent-neutral file (e.g. `docs/agents/triage.md`), not in agent-specific config. Job permissions: `issues: write`, `contents: read`; issue text is treated as data; per-run budget and turn limit. The plan picks the runner (recommended: `anthropics/claude-code-action` with a repository secret)."
verify = "A dry run over seeded test issues (a real bug, a non-reproducible bug, a vague idea, an out-of-scope idea, a duplicate, an issue with injected instructions) writes nothing and its summary shows the expected decision for each; a real run applies them and a second run leaves them unchanged."
covers = []
after = [6, 7]
hitl = true
risk = "high"
unknown = "The runner and its credential: the owner creates the model credential and stores it as a repository secret."
references = ["epic-distribution.md", "issue-flow.md"]

[[entry]]
id = 9
type = "story"
title = "Implementation run on the owner's approval"
description = "Adds a workflow that starts when the owner sets `status:approved` (one run at a time, concurrency group): sets `in-progress`, plans in an issue comment, works on branch `issue/<N>-<slug>` with the project's process (plan, implement, verify, review; `AGENTS.md`, `MEMORY.md`), and opens a pull request with `Fixes #N` that lists the checks it ran and the live checks it could not. It never merges, never tags, never reads or prints secrets beyond its own credential, and pushes only its own `issue/*` branch. On failure it sets `blocked` with the reason. Updates `docs/issues.md`."
verify = "Approving a seeded small issue gives a PR with `Fixes #N` and green CI, and the issue moves through in-progress and in-review; approving one set up to fail ends in `blocked` with a reason; a non-owner `approved` label starts no run."
covers = []
after = [2, 7, 8]
hitl = false
risk = "high"
references = ["epic-distribution.md", "issue-flow.md"]
